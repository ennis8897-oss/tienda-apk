<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Mi TV Store</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><header><div class="wrap"><h1>⚙️ Administrador</h1><p>Mi TV Store</p></div></header>
<main class="wrap">
<section id="login" class="panel"><h2>Iniciar sesión</h2>
<input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña">
<button id="loginBtn">Entrar</button><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden">
<div class="panel"><h2>Subir APK</h2>
<input id="name" placeholder="Nombre de la aplicación">
<input id="version" placeholder="Versión (ej. 1.0)">
<textarea id="description" placeholder="Descripción"></textarea>
<input id="apk" type="file" accept=".apk,application/vnd.android.package-archive">
<button id="uploadBtn">Subir aplicación</button><div id="uploadMsg" class="msg"></div></div>
<div class="panel"><h2>Aplicaciones</h2><div id="list"></div></div>
<button id="logoutBtn" class="secondary">Cerrar sesión</button>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
async function init(){const {data}=await db.auth.getSession(); if(data.session) showDash(); else showLogin()}
function showLogin(){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}
async function showDash(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadList()}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'Entrando...';if(!error)showDash()}
$('logoutBtn').onclick=async()=>{await db.auth.signOut();showLogin()}
$('uploadBtn').onclick=async()=>{
 const file=$('apk').files[0]; if(!file){$('uploadMsg').textContent='Elegí un APK.';return}
 if(!file.name.toLowerCase().endsWith('.apk')){$('uploadMsg').textContent='Solo se permiten archivos APK.';return}
 if(file.size>50*1024*1024){$('uploadMsg').textContent='El APK supera el límite gratuito de 50 MB.';return}
 const user=(await db.auth.getUser()).data.user; const safe=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
 $('uploadMsg').textContent='Subiendo...';
 let r=await db.storage.from('apks').upload(safe,file,{contentType:'application/vnd.android.package-archive',upsert:false});
 if(r.error){$('uploadMsg').textContent=r.error.message;return}
 const url=db.storage.from('apks').getPublicUrl(safe).data.publicUrl;
 const {error}=await db.from('apps').insert({name:$('name').value||file.name,version:$('version').value||'1.0',description:$('description').value||'',file_url:url,file_path:safe,published:true,created_by:user.id});
 $('uploadMsg').textContent=error?error.message:'¡Aplicación subida!';
 if(!error){$('name').value='';$('version').value='';$('description').value='';$('apk').value='';loadList()}
}
async function loadList(){
 const box=$('list');const {data,error}=await db.from('apps').select('*').order('created_at',{ascending:false});
 if(error){box.textContent=error.message;return}
 box.innerHTML=data.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><small> v${esc(a.version||'1.0')}</small></div><button onclick="delApp('${a.id}','${encodeURIComponent(a.file_path||'')}')">Eliminar</button></div>`).join('')||'No hay aplicaciones.';
}
async function delApp(id,path){
 if(!confirm('¿Eliminar esta aplicación?'))return;
 await db.from('apps').delete().eq('id',id);
 if(path)await db.storage.from('apks').remove([decodeURIComponent(path)]);
 loadList();
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
init();
</script></body></html>
