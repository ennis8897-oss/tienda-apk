<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Mi TV Store</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><header><div class="wrap"><h1>⚙️ Administrador</h1><p>Mi TV Store</p></div></header>
<main class="wrap">
<section id="login" class="panel"><h2>Iniciar sesión</h2>
<input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña">
<button id="loginBtn">Entrar</button><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden">
<div class="panel"><h2>Subir APK</h2>
<input id="name" placeholder="Nombre de la aplicación">
<input id="version" placeholder="Versión (ej. 1.0)">
<textarea id="description" placeholder="Descripción"></textarea>
<input id="apk" type="file" accept=".apk,application/vnd.android.package-archive"><input id="apkUrl" type="url" placeholder="O pegá el enlace HTTPS de descarga del APK"><p><small>Para subir archivos directamente necesitás Firebase Storage habilitado. Si no, podés usar un enlace HTTPS a tu APK.</small></p>
<button id="uploadBtn">Subir aplicación</button><div id="uploadMsg" class="msg"></div></div>
<div class="panel"><h2>Aplicaciones</h2><div id="list"></div></div>
<button id="logoutBtn" class="secondary">Cerrar sesión</button>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="../assets/config.js"></script>
<script>
const auth=firebase.auth(), storage=firebase.storage(), $=id=>document.getElementById(id);
function showLogin(){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}
function showDash(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadList()}
auth.onAuthStateChanged(user=>{if(user)showDash();else showLogin()});
$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value,$('password').value);$('loginMsg').textContent='';}catch(e){$('loginMsg').textContent=e.message}};
$('logoutBtn').onclick=()=>auth.signOut();
$('uploadBtn').onclick=async()=>{
 const file=$('apk').files[0], givenUrl=$('apkUrl').value.trim();
 if(!file&&!givenUrl){$('uploadMsg').textContent='Elegí un APK o pegá un enlace HTTPS.';return}
 if(file&&!file.name.toLowerCase().endsWith('.apk')){$('uploadMsg').textContent='Solo se permiten archivos APK.';return}
 if(file&&file.size>50*1024*1024){$('uploadMsg').textContent='El archivo supera el límite de 50 MB de este formulario.';return}
 if(!file&&!/^https:\/\//i.test(givenUrl)){$('uploadMsg').textContent='El enlace debe empezar con https://';return}
 const user=auth.currentUser;if(!user)return;
 $('uploadBtn').disabled=true;$('uploadMsg').textContent='Publicando...';
 let path='',url=givenUrl;
 try{
   if(file){path='apks/'+user.uid+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const ref=storage.ref(path);await ref.put(file,{contentType:'application/vnd.android.package-archive'});url=await ref.getDownloadURL()}
   await firestore.collection('apps').add({name:$('name').value.trim()||(file?.name||'Aplicación'),version:$('version').value.trim()||'1.0',description:$('description').value.trim(),file_url:url,file_path:path,published:true,created_by:user.uid,created_at:firebase.firestore.FieldValue.serverTimestamp()});
   $('uploadMsg').textContent='¡Aplicación publicada!';for(const id of ['name','version','description','apk','apkUrl'])$(id).value='';loadList();
 }catch(e){$('uploadMsg').textContent='Error: '+e.message+' (revisá las reglas y Storage)';console.error(e)}finally{$('uploadBtn').disabled=false}
};
async function loadList(){const box=$('list');try{const snapshot=await firestore.collection('apps').get();const data=snapshot.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at?.toMillis?.()||0)-(a.created_at?.toMillis?.()||0));box.replaceChildren();if(!data.length){box.textContent='No hay aplicaciones.';return}data.forEach(a=>{const row=document.createElement('div');row.className='row';const info=document.createElement('div');const title=document.createElement('b');title.textContent=a.name||'Aplicación';const version=document.createElement('small');version.textContent=' v'+(a.version||'1.0');info.append(title,version);const button=document.createElement('button');button.textContent='Eliminar';button.onclick=()=>delApp(a.id,a.file_path||'');row.append(info,button);box.append(row)})}catch(e){box.textContent='Error: '+e.message}}
async function delApp(id,path){if(!confirm('¿Eliminar esta aplicación?'))return;try{await firestore.collection('apps').doc(id).delete();if(path.startsWith('apks/')){try{await storage.ref(path).delete()}catch(e){alert('Se eliminó del catálogo, pero no se pudo borrar el archivo: '+e.message)}}loadList()}catch(e){alert('Error: '+e.message)}}
</script></body></html>
