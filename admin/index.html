<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar · Mi TV Store</title><link rel="stylesheet" href="../assets/style.css"><style>
#tvRemoteCursor{position:fixed;z-index:999999;left:0;top:0;width:22px;height:30px;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}
#tvRemoteCursor svg{display:block}
.tv-pointer-hover{outline:2px solid #c4b5fd!important;outline-offset:3px}
.tv-cursor-click{filter:drop-shadow(0 0 5px #a78bfa)}
</style></head>
<body><main class="wrap" style="max-width:850px;padding:35px 0"><a class="brand" href="../"><span class="brand-icon">📺</span><span><strong>Mi TV Store</strong><small>Panel de administración</small></span></a>
<section id="login" class="panel" style="margin-top:24px"><h2>Iniciar sesión</h2><input id="email" type="email" autocomplete="username" placeholder="Correo" style="display:block;width:100%;padding:13px;margin:10px 0;border-radius:10px"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" style="display:block;width:100%;padding:13px;margin:10px 0;border-radius:10px"><button id="loginBtn">Entrar</button><div id="loginMsg" class="msg" role="status"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Subir APK</h2><input id="name" maxlength="100" placeholder="Nombre de la aplicación" style="display:block;width:100%;padding:12px;margin:8px 0"><input id="version" maxlength="30" placeholder="Versión (ej. 1.0)" style="display:block;width:100%;padding:12px;margin:8px 0"><textarea id="description" maxlength="1000" placeholder="Descripción" style="display:block;width:100%;padding:12px;margin:8px 0"></textarea><label for="apk">Archivo APK (máximo 50 MB)</label><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" style="display:block;margin:12px 0"><button id="uploadBtn">Subir aplicación</button><div id="uploadMsg" class="msg" role="status"></div></div>
<div class="panel" style="margin-top:18px"><h2>Aplicaciones publicadas</h2><div id="list">Cargando...</div></div><button id="logoutBtn" style="margin-top:15px">Cerrar sesión</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

</script><script src="../assets/config.js"></script><script>
const $=id=>document.getElementById(id);let sb=null;
function showLogin(){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}
async function showDashboard(){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadList()}
function boot(){if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||window.SUPABASE_URL.includes('PEGAR_')||window.SUPABASE_ANON_KEY.includes('PEGAR_')){$('loginMsg').textContent='Primero completá assets/config.js con la URL y la clave pública de Supabase.';$('loginBtn').disabled=true;return}sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);sb.auth.getSession().then(({data})=>data.session?showDashboard():showLogin());sb.auth.onAuthStateChange((_event,session)=>session?showDashboard():showLogin())}
$('loginBtn').onclick=async()=>{if(!sb)return;$('loginBtn').disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent='No se pudo iniciar sesión: '+e.message}finally{$('loginBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{if(sb)await sb.auth.signOut()};
function safeName(s){return s.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-140)||'app.apk'}
$('uploadBtn').onclick=async()=>{const file=$('apk').files[0];if(!file){$('uploadMsg').textContent='Elegí un archivo APK.';return}if(!file.name.toLowerCase().endsWith('.apk')){$('uploadMsg').textContent='El archivo debe terminar en .apk.';return}if(file.size>50*1024*1024){$('uploadMsg').textContent='El archivo supera los 50 MB.';return}const {data:{user}}=await sb.auth.getUser();if(!user){$('uploadMsg').textContent='Iniciá sesión nuevamente.';return}const b=$('uploadBtn');b.disabled=true;let path='';try{path=user.id+'/'+Date.now()+'-'+safeName(file.name);$('uploadMsg').textContent='Subiendo APK a Supabase...';const {error:upError}=await sb.storage.from(window.SUPABASE_BUCKET||'apks').upload(path,file,{contentType:'application/vnd.android.package-archive',cacheControl:'3600',upsert:false});if(upError)throw upError;const {data:pub}=sb.storage.from(window.SUPABASE_BUCKET||'apks').getPublicUrl(path);const url=pub.publicUrl+'?download='+encodeURIComponent(file.name);const {error}=await sb.from('apps').insert({name:$('name').value.trim()||file.name.replace(/\.apk$/i,''),version:$('version').value.trim()||'1.0',description:$('description').value.trim(),file_url:url,file_path:path,published:true,created_by:user.id});if(error){await sb.storage.from(window.SUPABASE_BUCKET||'apks').remove([path]);throw error}$('uploadMsg').textContent='¡APK publicado correctamente!';['name','version','description','apk'].forEach(id=>$(id).value='');await loadList()}catch(e){$('uploadMsg').textContent='Error: '+e.message+' Revisá que ejecutaste supabase-setup.sql.'}finally{b.disabled=false}};
async function loadList(){const box=$('list');box.textContent='Cargando...';try{const {data,error}=await sb.from('apps').select('id,name,version,file_path').order('created_at',{ascending:false});if(error)throw error;box.replaceChildren();if(!data?.length){box.textContent='Todavía no hay aplicaciones.';return}for(const a of data){const row=document.createElement('div');row.className='row';row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff20';const label=document.createElement('span');label.textContent=a.name+' v'+(a.version||'1.0');const btn=document.createElement('button');btn.textContent='Eliminar';btn.onclick=()=>deleteApp(a);row.append(label,btn);box.append(row)}}catch(e){box.textContent='Error: '+e.message}}
async function deleteApp(a){if(!confirm('¿Eliminar '+a.name+'?'))return;try{const {error}=await sb.from('apps').delete().eq('id',a.id);if(error)throw error;if(a.file_path){const {error:se}=await sb.storage.from(window.SUPABASE_BUCKET||'apks').remove([a.file_path]);if(se)alert('Registro eliminado, pero el archivo no: '+se.message)}await loadList()}catch(e){alert('Error al eliminar: '+e.message)}}
boot();
</script>
<script>
/* Puntero real simulado para controles Android TV (DPAD y teclas de teclado). */
(function(){
 if(window.__tvRemoteMouseInstalled)return;window.__tvRemoteMouseInstalled=true;
 const c=document.createElement('div');c.id='tvRemoteCursor';c.setAttribute('aria-hidden','true');
 c.style.cssText='position:fixed!important;left:0;top:0;width:34px;height:44px;z-index:2147483647!important;pointer-events:none!important;display:block!important;opacity:1!important;filter:drop-shadow(0 2px 3px #000);transform:translate3d(45vw,35vh,0)';
 c.innerHTML='<svg viewBox="0 0 28 38" width="34" height="44" xmlns="http://www.w3.org/2000/svg"><path d="M3 2 L3 29 L10 22 L16 36 L21 34 L15 20 L25 20 Z" fill="#00e5ff" stroke="#07111f" stroke-width="2.5" stroke-linejoin="round"/></svg>';
 document.body.appendChild(c);
 let x=Math.max(4,innerWidth*.45),y=Math.max(4,innerHeight*.35),last=0;
 const paint=()=>{c.style.transform='translate3d('+x+'px,'+y+'px,0)'};
 function move(dx,dy){const now=Date.now(),step=now-last<100?30:22;last=now;x=Math.max(0,Math.min(innerWidth-35,x+dx*step));y=Math.max(0,Math.min(innerHeight-45,y+dy*step));if(y>innerHeight-75&&dy>0){scrollBy(0,step*2);y=innerHeight-75}if(y<35&&dy<0&&scrollY>0){scrollBy(0,-step*2);y=35}paint();document.querySelectorAll('.tv-pointer-hover').forEach(n=>n.classList.remove('tv-pointer-hover'));const el=document.elementFromPoint(x+5,y+5);const target=el&&el.closest('a,button,input,textarea,select,[role="button"],label');if(target)target.classList.add('tv-pointer-hover');}
 function click(){const el=document.elementFromPoint(x+6,y+6);if(!el)return;const t=el.closest('a,button,input,textarea,select,label,[role="button"]')||el;if(t.matches('input,textarea')){t.focus();if(t.type==='file')t.click();return}if(t.matches('select')){t.focus();t.click();return}t.click();}
 function handle(e){const k=e.key||'',code=e.keyCode||e.which;let dx=0,dy=0,handled=true;
  if(k==='ArrowLeft'||code===37||code===21)dx=-1;
  else if(k==='ArrowRight'||code===39||code===22)dx=1;
  else if(k==='ArrowUp'||code===38||code===19)dy=-1;
  else if(k==='ArrowDown'||code===40||code===20)dy=1;
  else if(k==='Enter'||k==='NumpadEnter'||k===' '||code===13||code===23||code===66){if(e.repeat)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();click();return}
  else handled=false;
  if(!handled)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();move(dx,dy);
 }
 document.addEventListener('keydown',handle,true);
 document.addEventListener('mousemove',e=>{if(e.detail>0){x=e.clientX;y=e.clientY;paint();}},true);
 window.addEventListener('resize',()=>{x=Math.min(x,innerWidth-35);y=Math.min(y,innerHeight-45);paint()});
 paint();
})();
</script></body></html>
